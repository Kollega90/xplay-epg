name: Build EPG

on:
  schedule:
    - cron: '43 */4 * * *'     # каждые 4 часа (минута 43 — реже пропуски)
  workflow_dispatch: {}         # и вручную кнопкой Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Источники по очереди, пока один не скачается. Можно поменять/добавить свои (через пробел).
      EPG_URLS: >-
        http://only4.tv/epg/epg.xml.gz
        http://only4.tv/epg/epg.xml
        http://1lot.tv/epg/epg.xml
    steps:
      - uses: actions/checkout@v4
      - name: Download EPG
        run: |
          ok=0
          for u in $EPG_URLS; do
            echo "try $u"
            if curl -fL --retry 3 --max-time 600 -o epg.src "$u" && [ -s epg.src ]; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "no EPG source reachable"; exit 1; }
          ls -la epg.src
      - name: Build epg.json and channel files
        run: |
          mkdir -p site
          python3 build_epg.py epg.src site/epg.json
          du -sh site site/ch
      - name: DIAG5 (временно) альтернативные источники
        continue-on-error: true
        run: |
          cat > alt.py <<'PYEOF'
          import sys, os, gzip, json, re, time, calendar, subprocess, xml.etree.ElementTree as ET
          def ts(s):
              m = re.match(r'^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)?\s*([+-]\d{4})?', s or '')
              if not m: return 0
              t = calendar.timegm((int(m[1]), int(m[2]), int(m[3]), int(m[4]), int(m[5]), int(m[6] or 0)))
              if m[7]:
                  off = (int(m[7][1:3]) * 60 + int(m[7][3:5])) * 60
                  t -= off if m[7][0] == '+' else -off
              return t
          def norm(s): return re.sub(r'[^a-zа-яёіїєґ0-9+]', '', (s or '').lower())
          main = json.load(open('site/epg.json', encoding='utf-8'))['c']
          now = time.time()
          need = {}   # our channel -> [(start, stop)] without desc in next 24h
          for cid, e in main.items():
              l = [(p[0], p[1]) for p in e['p'] if p[1] > now and p[0] < now + 86400 and not (len(p) > 3 and p[3])]
              if l: need[cid] = l
          print('our channels', len(main), 'with programmes lacking desc (next 24h):', len(need), 'programmes:', sum(len(v) for v in need.values()))
          byname = {}
          for cid, e in main.items():
              for n in e['n']: byname.setdefault(norm(n), cid)
          for url in sys.argv[1:]:
              print('=====', url)
              fn = '/tmp/alt.bin'
              r = subprocess.run(['curl', '-sSL', '-m', '240', '-o', fn, '-w', '%{http_code} %{size_download} %{content_type}', url], capture_output=True, text=True)
              print('curl:', r.stdout, r.stderr[:200])
              try:
                  raw = open(fn, 'rb').read()
              except Exception as ex:
                  print('нет файла', ex); continue
              print('head:', raw[:120])
              try:
                  f = open(fn, 'rb')
                  if raw[:2] == b'\x1f\x8b': f = gzip.GzipFile(fileobj=f)
                  ch = {}; progs = {}; nd = tot = 0
                  for ev, el in ET.iterparse(f, events=('end',)):
                      if el.tag == 'channel':
                          ch[el.get('id')] = [d.text for d in el.findall('display-name') if d.text]; el.clear()
                      elif el.tag == 'programme':
                          a = ts(el.get('start')); cid = el.get('channel')
                          if a > now - 3600 and a < now + 86400:
                              d = el.find('desc'); has = d is not None and d.text and len(d.text.strip()) > 20
                              tot += 1; nd += 1 if has else 0
                              if has: progs.setdefault(cid, []).append(a)
                          el.clear()
              except Exception as ex:
                  print('parse error', ex); continue
              print('alt channels', len(ch), 'programmes next24h', tot, 'with desc', nd)
              byid = sum(1 for c in ch if c in main)
              alt2our = {}
              for c, names in ch.items():
                  if c in main: alt2our[c] = c
                  else:
                      for n in names:
                          if norm(n) in byname: alt2our[c] = byname[norm(n)]; break
              print('matched to ours: by id', byid, 'total (id+name)', len(alt2our))
              gain = 0
              for c, o in alt2our.items():
                  if o in need and c in progs:
                      for (a, b) in need[o]:
                          if any(abs(x - a) <= 300 for x in progs[c]): gain += 1
              print('programmes without desc that alt would fill (±5 мин):', gain)
              for c in ['1plus1-ukraina', 'novy-kanal-ua', 'tet-ua']:
                  print(' ', c, 'in alt by id' if c in ch else 'not by id')

          PYEOF
          python3 alt.py https://iptvx.one/EPG https://iptvx.one/EPG_LITE.xml.gz http://gabbarit.drm-play.com/epg_14.xml.gz http://gabbarit.epg.one/epg_1.xml.gz
      - name: Sanity check
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open('site/epg.json', encoding='utf-8'))
          assert len(d['c']) > 50, 'too few channels'
          files = [f for f in os.listdir('site/ch') if f.endswith('.json')]
          assert len(files) > 50, 'too few channel files'
          nf = sum(1 for v in d['c'].values() if v.get('f'))
          assert nf == len(files), 'f/file mismatch: %d vs %d' % (nf, len(files))
          total = sum(os.path.getsize(os.path.join('site/ch', f)) for f in files)
          assert total < 600 * 1024 * 1024, 'site too big'
          print('ok channels', len(d['c']), 'files', len(files), 'MB %.1f' % (total / 1048576.0))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
