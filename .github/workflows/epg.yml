name: Build EPG

on:
  schedule:
    - cron: '43 */4 * * *'     # каждые 4 часа (минута 43 — реже пропуски)
  workflow_dispatch: {}         # и вручную кнопкой Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Источники по очереди, пока один не скачается. Можно поменять/добавить свои (через пробел).
      EPG_URLS: >-
        http://only4.tv/epg/epg.xml.gz
        http://only4.tv/epg/epg.xml
        http://1lot.tv/epg/epg.xml
    steps:
      - uses: actions/checkout@v4
      - name: Download EPG
        run: |
          ok=0
          for u in $EPG_URLS; do
            echo "try $u"
            if curl -fL --retry 3 --max-time 600 -o epg.src "$u" && [ -s epg.src ]; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "no EPG source reachable"; exit 1; }
          ls -la epg.src
      - name: Build epg.json and channel files
        run: |
          mkdir -p site
          python3 build_epg.py epg.src site/epg.json
          du -sh site site/ch
      - name: DIAG4 (временно) описания
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, time, os
          d = json.load(open('site/epg.json', encoding='utf-8'))['c']
          now = time.time()
          tot = hasd = 0
          for e in d.values():
              for p in e['p']:
                  tot += 1; hasd += 1 if len(p) > 3 and p[3] else 0
          print('main: programmes', tot, 'with desc', hasd)
          for i in ['1plus1-ukraina', 'stb-ua', 'novy-kanal-ua', 'tet-ua', 'mega-ua']:
              e = d[i]
              cur = [p for p in e['p'] if p[0] <= now < p[1]]
              c = json.load(open('site/ch/%s.json' % e['f'], encoding='utf-8'))['p']
              cf = [p for p in c if p[0] <= now < p[1]]
              withd = sum(1 for p in c if len(p) > 3)
              print(i, 'main cur desc len:', [len(p[3]) if len(p) > 3 else 0 for p in cur], '| file cur:', [len(p[3]) if len(p) > 3 else 0 for p in cf], '| file progs', len(c), 'with desc', withd)
          nodesc = 0; tot2 = 0
          for f in os.listdir('site/ch')[:400]:
              for p in json.load(open('site/ch/' + f, encoding='utf-8'))['p']:
                  tot2 += 1; nodesc += 0 if len(p) > 3 else 1
          print('sample 400 files: progs', tot2, 'without desc', nodesc)
          PY
      - name: Sanity check
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open('site/epg.json', encoding='utf-8'))
          assert len(d['c']) > 50, 'too few channels'
          files = [f for f in os.listdir('site/ch') if f.endswith('.json')]
          assert len(files) > 50, 'too few channel files'
          nf = sum(1 for v in d['c'].values() if v.get('f'))
          assert nf == len(files), 'f/file mismatch: %d vs %d' % (nf, len(files))
          total = sum(os.path.getsize(os.path.join('site/ch', f)) for f in files)
          assert total < 600 * 1024 * 1024, 'site too big'
          print('ok channels', len(d['c']), 'files', len(files), 'MB %.1f' % (total / 1048576.0))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
